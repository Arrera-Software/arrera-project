services:
  db:
    image: postgres:16-alpine
    container_name: arrera_project_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NON publié sur l'hôte : la base reste accessible uniquement au
    # réseau interne Compose. Décommentez seulement pour un accès local ponctuel.
    # ports:
    #   - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arrera_project_web
    # Migration auto de la base de données et collecte des fichiers statiques WhiteNoise
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    # Le code source est copié dans l'image (pas de montage de volume en production).
    # Seuls les médias téléversés sont persistés.
    volumes:
      - media_data:/app/media
    ports:
      - "${WEB_PORT:-8020}:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
